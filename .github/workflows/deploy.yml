name: Deploy to GitHub Pages

# Builds the Vite project and deploys the static dist/ output to GitHub Pages
# using the native GitHub Actions deployment (Pages source = "GitHub Actions").
#
# The github-pages environment only permits deployments from the repository's
# DEFAULT branch. This repo's default branch is currently
# claude/hopeful-faraday-ufz6i6, so it is listed here alongside main/master —
# if you later make main the default branch, deployments from main will work
# too with no further changes.
on:
  push:
    branches:
      - main
      - master
      - claude/hopeful-faraday-ufz6i6
  workflow_dispatch: {}

# Permissions required by the official Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        env:
          # The build never needs a browser; skip Playwright's (test-only) download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build (type-check + production bundle)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The github-pages environment is required by actions/deploy-pages and, by
    # default, only permits deployments from the repository's default branch.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
